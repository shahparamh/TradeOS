name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.RENDER_BACKEND_URL }}"
          fi
          
          if [ -n "$URL" ]; then
            # Strip trailing slash if present
            CLEAN_URL="${URL%/}"
            curl -f "$CLEAN_URL/api/health" || exit 1
          else
            echo "Error: RENDER_BACKEND_URL is not set in GitHub Settings."
            echo "Please ensure RENDER_BACKEND_URL is configured in your repository settings under:"
            echo "Settings -> Secrets and variables -> Actions (as either a Secret or a Variable)"
            exit 1
          fi
