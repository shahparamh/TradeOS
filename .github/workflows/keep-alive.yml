name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.RENDER_BACKEND_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="${{ secrets.BACKEND_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="${{ vars.BACKEND_URL }}"
          fi
          
          if [ -n "$URL" ]; then
            # Strip trailing slash if present
            CLEAN_URL="${URL%/}"
            curl -f "$CLEAN_URL/api/health" || exit 1
          else
            echo "Error: Neither RENDER_BACKEND_URL nor BACKEND_URL is set in Repository settings."
            echo "Please ensure the variable is defined under Repository variables (the section at the bottom of your image)."
            exit 1
          fi
